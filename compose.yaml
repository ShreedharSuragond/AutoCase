services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: autocase
      POSTGRES_USER: autocase_app
      POSTGRES_PASSWORD: autocase
    ports:
      - "5433:5432"
    volumes:
      - autocase-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autocase_app -d autocase"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  autocase-postgres-data:
